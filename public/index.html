    공유 카드 이미지는 /student 와 같은 가로 카드(1200x630, premind.co.kr/og/student.png)다.
  - 주소는 /app 접두사 기준이다(배포 빌드의 baseUrl). 가운뎃점은 쓰지 않는다(브랜드 규칙).
