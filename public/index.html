<!DOCTYPE html>
<!--
  웹 빌드의 HTML 껍데기. 학생 웹 앱(premind.co.kr/app)은 2026-10-05 에 접었다(CEO "STUDENT 웹은 제거, 아예
  따로 간다"). 이제 웹 빌드는 내부 도구다: 데모 계정으로 QA 하고 스토어 스크린샷을 찍는 데만 쓴다
  (scripts/export-web-preview.mjs, scripts/refresh-store-assets.mjs). 그래서 검색에 올리지 않고(noindex),
  공유 카드(og)도 두지 않는다. Expo 웹 export(output: single)가 번들 <script> 와 favicon 만 끼워 넣는다.
-->
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <meta name="description" content="프리마인드(PREMIND)는 강의를 녹음하거나 영상, 유튜브 링크, PDF를 올리면 AI가 대본, 요약, 마인드맵, 문제를 만들어 주는 공부 앱이에요. 무료로 시작해요." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#D25417" />
    <meta name="application-name" content="프리마인드 PREMIND" />
    <meta name="apple-mobile-web-app-title" content="PREMIND" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->

      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>

      PREMIND 학생 앱은 자바스크립트가 켜져 있어야 열려요. 제품 소개는 https://premind.co.kr/student 에서 볼 수 있어요.
