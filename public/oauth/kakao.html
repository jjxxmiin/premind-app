<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex,nofollow">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>PREMIND 카카오 로그인</title>
  </head>
  <body>
    <p id="status" role="status">로그인을 완료하고 있어요.</p>
    <script>
      (() => {
        const callbackUrl = window.location.href;
        // Strip the one-time authorization code before any other navigation.
        window.history.replaceState(null, '', window.location.pathname);
        if (!window.opener) {
          document.getElementById('status').textContent = '로그인 창이 닫혔어요. 원래 화면에서 다시 로그인해 주세요.';
          return;
        }
        window.opener.postMessage({ type: 'premind:kakao:callback', url: callbackUrl }, window.location.origin);
      })();
    </script>
  </body>
</html>
